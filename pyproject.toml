[project]
name = "pipeline-northwind"
version = "0.1.0"
description = "Pipeline de dados do CSV ao dashboard (raw -> refined -> marts) com Python, SQL e DuckDB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=2.0.0",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["pipeline"]

[tool.coverage.report]
fail_under = 70
show_missing = true
